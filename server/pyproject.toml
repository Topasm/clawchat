[project]
name = "clawchat-server"
version = "0.1.2"
description = "ClawChat FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "aiosqlite>=0.20.0",
  "cryptography>=42.0.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "icalendar>=6.0.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.1.0",
  "python-dateutil>=2.9.0",
  "python-dotenv>=1.0.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.27.0",
  "watchfiles>=0.21.0",
  "websockets>=13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]
build = [
  "pyinstaller==6.22.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "integration: tests that require optional local services or external tools",
]

[tool.uv]
package = false
