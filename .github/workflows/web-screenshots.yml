name: Web screenshots

# Renders key web screens against a seeded backend (e2e/visual) and compares
# them with the baselines in e2e/visual/__screenshots__. The desktop app uses
# the same renderer, so this covers it too. An intended change re-records the
# baselines with the "Record web screenshots" workflow.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: npm ci
      - run: uv sync --project server --locked
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the web renderer
        run: npm run build:web
      - name: Compare screenshots with the baselines
        run: npm run test:visual
      - name: Upload screenshots and differences
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots
          path: |
            e2e/visual/__screenshots__/
            e2e/visual/test-results/
          if-no-files-found: warn
