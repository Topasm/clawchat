name: CI

on:
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt
      - run: npm ci
      - run: npm run audit:prod
      - run: npm run test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run format:rust:check
      - run: npm run check:actions-pinned
      - run: npm run check:design-tokens
      - run: npm run check:icon-design
      - run: npm run check:licenses
      - run: npm run check:runtime-boundary
      - run: npm run check:release-version

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:tauri-renderer
      - run: npm run check:renderer-budget

  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.2'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked
        working-directory: server
      - name: Verify database migrations
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic check
        working-directory: server
        env:
          DATABASE_URL: sqlite+aiosqlite:///./migration-check.db
          JWT_SECRET: ci-migration-check-secret
      - run: uv run --locked pytest -q
        working-directory: server
