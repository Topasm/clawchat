name: Publish Docker

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      # Publishing a GitHub release triggers this workflow. Docker Hub
      # credentials are optional -- a desktop release should not be reported as
      # failed just because the image is not published from here -- so resolve
      # them first and skip the rest when they are absent. A dispatch that
      # explicitly asks to publish still fails loudly.
      - name: Resolve Docker Hub credentials
        id: credentials
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            printf 'configured=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'DOCKER_USERNAME and DOCKER_PASSWORD are required to publish the image' >&2
            exit 1
          fi
          printf 'configured=false\n' >> "$GITHUB_OUTPUT"
          echo '::warning title=Docker image not published::No Docker Hub credentials configured, so the release image was not pushed.'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.credentials.outputs.configured == 'true'

      - name: Login to Docker Hub
        if: steps.credentials.outputs.configured == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker metadata
        id: meta
        if: steps.credentials.outputs.configured == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/clawchat
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Docker Buildx
        if: steps.credentials.outputs.configured == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        if: steps.credentials.outputs.configured == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
