name: Build Android

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['clawchat-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify generated TypeScript and Kotlin API contracts
        run: node scripts/generate-api-contracts.js --check

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # The debug APK is packaged in its own invocation. Packaging debug and
      # release in one run failed intermittently in :app:packageDebug
      # (IncrementalSplitterRunnable) with no cause in the log; the release
      # workflow, which never packages debug, never failed there.
      - name: Test, lint, and build Android release artifacts
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease bundleRelease --warning-mode all --stacktrace

      - name: Build the installable debug APK
        working-directory: android
        run: ./gradlew assembleDebug --warning-mode all --stacktrace

      # Robolectric renders the screens and Roborazzi compares them with the
      # baselines in each module's src/test/screenshots. An intended UI change
      # re-records them with the "Record Android screenshots" workflow.
      - name: Verify screenshots against the baselines
        working-directory: android
        run: ./gradlew verifyRoborazziDebug --warning-mode all --stacktrace

      - name: Upload screenshots and differences
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-screenshots
          path: |
            android/**/src/test/screenshots/*.png
            android/**/build/outputs/roborazzi/**/*.png
          if-no-files-found: warn

      - name: Verify optimized widget callbacks
        run: bash scripts/check-android-widget-callbacks.sh android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload Android artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-builds
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
