name: Record web screenshots

# Re-renders the web screenshot baselines on the branch it runs on and commits
# them there. Run it after an intended UI change.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.10.2'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: npm ci
      - run: uv sync --project server --locked
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the web renderer
        run: npm run build:web
      - name: Record screenshots
        run: npm run test:visual -- --update-snapshots
      - name: Commit the new baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "test(web): record screenshot baselines"
          git push
      - name: Upload screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-screenshots
          path: e2e/visual/__screenshots__/
