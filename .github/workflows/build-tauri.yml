name: Build Tauri Preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            artifact: ClawChat-tauri-linux-x64
            bundles: appimage,deb
            budget_platform: linux
          - name: Windows x64
            os: windows-latest
            artifact: ClawChat-tauri-windows-x64
            bundles: nsis
            budget_platform: windows
          - name: macOS arm64
            os: macos-14
            artifact: ClawChat-tauri-macos-arm64
            bundles: dmg
            budget_platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-build.txt

      - name: Build FastAPI onedir resource
        shell: bash
        run: |
          python -m pip install -r server/requirements-build.txt
          python scripts/build-tauri-server-bundle.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check:actions-pinned
      - run: npm test
      - run: npm run test:tauri-migration-audit
      - run: npm run test:rust-core
      - run: npm run test:rust
      - run: npm run lint:rust
      - run: npm run format:rust:check
      - run: npm run check:tauri-server

      - name: Build unsigned Tauri preview package
        run: npx tauri build --config src-tauri/tauri.bundle.conf.json --bundles "${{ matrix.bundles }}"
        env:
          APPLE_SIGNING_IDENTITY: '-'

      - name: Check Tauri artifact size budget
        run: npm run check:tauri-artifact-budget -- src-tauri/target/release/bundle "${{ matrix.budget_platform }}"

      - name: Verify packaged Linux server resource
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          test -n "$deb"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "$deb" "$extracted"
          node scripts/verify-tauri-package.js "$extracted" --run-server

      - name: Verify packaged macOS server resource
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          node scripts/verify-tauri-package.js "$mount_dir" --run-server

      - name: Verify packaged Windows server resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'No NSIS installer was produced' }
          $extracted = Join-Path $env:RUNNER_TEMP 'clawchat-preview-package'
          New-Item -ItemType Directory -Path $extracted -Force | Out-Null
          & 7z.exe x $installer.FullName "-o$extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          node scripts/verify-tauri-package.js $extracted --run-server

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error
