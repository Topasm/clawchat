name: Release Tauri Desktop

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: tauri-desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:actions-pinned
      - run: npm run check:release-version

      - name: Require the current origin/main commit and a new release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo 'Desktop releases must run from the current origin/main commit.' >&2
            exit 1
          }
          version="$(node -p "require('./package.json').version")"
          tag="clawchat-v$version"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      # test:rust-core compiles the Rust workspace, which reaches libdbus-sys
      # through the tray and autostart plugins. The release job and the preview
      # build both install these; preflight did not, so it failed before any
      # release could be cut.
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:tauri-migration-audit
      - run: npm run test:rust-core
      - run: npm run format:rust:check

  release:
    name: ${{ matrix.name }}
    needs: preflight
    environment: desktop-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            bundles: appimage,deb
            budget_platform: linux
            release_artifact: ClawChat-release-linux
            release_paths: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig
              src-tauri/target/release/bundle/deb/*.deb
          - name: Windows x64
            os: windows-latest
            bundles: nsis
            budget_platform: windows
            release_artifact: ClawChat-release-windows
            release_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
              src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          - name: macOS arm64
            os: macos-26
            bundles: app,dmg
            budget_platform: macos
            release_artifact: ClawChat-release-macos-arm64
            release_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate updater signing secret presence
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_UPDATER_PUBKEY" || { echo 'TAURI_UPDATER_PUBKEY is required' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'TAURI_SIGNING_PRIVATE_KEY is required' >&2; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required' >&2; exit 1; }

      # Apple Developer ID signing is optional: it needs a paid account, and a
      # project has to be able to cut its first release without one. Updater
      # signing (below) is separate and stays mandatory. A partial Apple
      # configuration is a mistake rather than a choice, so it still fails.
      - name: Resolve Apple signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "$APPLE_CERTIFICATE" ] && [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then
            printf 'APPLE_SIGNING_ENABLED=0\n' >> "$GITHUB_ENV"
            echo '::warning title=macOS build is not Developer ID signed::No APPLE_CERTIFICATE configured. The app is ad-hoc signed, so macOS Gatekeeper warns on first launch and the build is not notarized.'
            exit 0
          fi
          test -n "$APPLE_CERTIFICATE" || { echo 'APPLE_CERTIFICATE is required when APPLE_CERTIFICATE_PASSWORD is set' >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'APPLE_CERTIFICATE_PASSWORD is required when APPLE_CERTIFICATE is set' >&2; exit 1; }
          test -n "$APPLE_ID" || { echo 'APPLE_ID is required for notarization' >&2; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo 'APPLE_PASSWORD is required for notarization' >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo 'APPLE_TEAM_ID is required for notarization' >&2; exit 1; }
          printf 'APPLE_SIGNING_ENABLED=1\n' >> "$GITHUB_ENV"

      - name: Resolve Windows signing configuration
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_WINDOWS_TIMESTAMP_URL: ${{ vars.TAURI_WINDOWS_TIMESTAMP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$WINDOWS_CERTIFICATE" ]; then
            printf 'WINDOWS_SIGNING_ENABLED=0\n' >> "$GITHUB_ENV"
            echo '::warning title=Windows build is not code signed::No WINDOWS_CERTIFICATE configured. SmartScreen warns users until the installer builds reputation.'
            exit 0
          fi
          test -n "$WINDOWS_CERTIFICATE_PASSWORD" || { echo 'WINDOWS_CERTIFICATE_PASSWORD is required when WINDOWS_CERTIFICATE is set' >&2; exit 1; }
          test -n "$TAURI_WINDOWS_TIMESTAMP_URL" || { echo 'TAURI_WINDOWS_TIMESTAMP_URL is required when signing Windows builds' >&2; exit 1; }
          printf 'WINDOWS_SIGNING_ENABLED=1\n' >> "$GITHUB_ENV"

      - name: Resolve Linux signing configuration
        if: runner.os == 'Linux'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$LINUX_GPG_PRIVATE_KEY" ]; then
            printf 'LINUX_SIGNING_ENABLED=0\n' >> "$GITHUB_ENV"
            echo '::warning title=AppImage is not GPG signed::No LINUX_GPG_PRIVATE_KEY configured. The updater still verifies its own signature.'
            exit 0
          fi
          test -n "$LINUX_GPG_PASSPHRASE" || { echo 'LINUX_GPG_PASSPHRASE is required when LINUX_GPG_PRIVATE_KEY is set' >&2; exit 1; }
          test -n "$LINUX_GPG_KEY_ID" || { echo 'LINUX_GPG_KEY_ID is required when LINUX_GPG_PRIVATE_KEY is set' >&2; exit 1; }
          printf 'LINUX_SIGNING_ENABLED=1\n' >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.10.2'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: server/uv.lock

      - name: Build FastAPI onedir resource
        shell: bash
        run: |
          uv sync --project server --locked --no-dev --group build
          uv run --project server --locked --no-dev --group build python scripts/build-tauri-server-bundle.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run check:tauri-server

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING_ENABLED == '1'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) {
            throw 'WINDOWS_CERTIFICATE is required'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'WINDOWS_CERTIFICATE_PASSWORD is required'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'clawchat-signing.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
            )
            $password = ConvertTo-SecureString `
              -String $env:WINDOWS_CERTIFICATE_PASSWORD `
              -Force `
              -AsPlainText
            $importedCertificates = @(
              Import-PfxCertificate `
                -FilePath $pfxPath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $password
            )
            $certificate = $importedCertificates |
              Where-Object HasPrivateKey |
              Select-Object -First 1
            if ($null -eq $certificate) {
              throw 'Imported Windows certificate has no private key'
            }
            "TAURI_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } finally {
            Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Import Apple Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == '1'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE" || { echo 'APPLE_CERTIFICATE is required' >&2; exit 1; }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || { echo 'APPLE_CERTIFICATE_PASSWORD is required' >&2; exit 1; }
          test -n "$APPLE_ID" || { echo 'APPLE_ID is required for notarization' >&2; exit 1; }
          test -n "$APPLE_PASSWORD" || { echo 'APPLE_PASSWORD is required for notarization' >&2; exit 1; }
          test -n "$APPLE_TEAM_ID" || { echo 'APPLE_TEAM_ID is required for notarization' >&2; exit 1; }
          certificate_path="$RUNNER_TEMP/clawchat-certificate.p12"
          keychain_path="$RUNNER_TEMP/clawchat-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf 'CLAWCHAT_SIGNING_KEYCHAIN=%s\n' "$keychain_path" >> "$GITHUB_ENV"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          identity="$(security find-identity -v -p codesigning "$keychain_path" \
            | awk -F\" '/Developer ID Application/ { print $2; exit }')"
          test -n "$identity" || { echo 'Developer ID Application identity was not found' >&2; exit 1; }
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$identity" >> "$GITHUB_ENV"

      - name: Ad-hoc sign macOS build
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED != '1'
        shell: bash
        run: |
          set -euo pipefail
          # "-" is codesign's ad-hoc identity. It does not establish trust, but
          # it produces a valid signature, which the macOS updater needs in
          # order to swap the bundle in place.
          printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"

      - name: Import Linux AppImage signing key
        if: runner.os == 'Linux' && env.LINUX_SIGNING_ENABLED == '1'
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ vars.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$LINUX_GPG_PRIVATE_KEY" || { echo 'LINUX_GPG_PRIVATE_KEY is required' >&2; exit 1; }
          test -n "$LINUX_GPG_PASSPHRASE" || { echo 'LINUX_GPG_PASSPHRASE is required' >&2; exit 1; }
          test -n "$LINUX_GPG_KEY_ID" || { echo 'LINUX_GPG_KEY_ID is required' >&2; exit 1; }
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --list-secret-keys "$LINUX_GPG_KEY_ID" >/dev/null
          printf 'SIGN=1\nSIGN_KEY=%s\nAPPIMAGETOOL_FORCE_SIGN=1\n' "$LINUX_GPG_KEY_ID" >> "$GITHUB_ENV"

      - run: npm run prepare:tauri-release
        env:
          TAURI_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          TAURI_UPDATER_ENDPOINT: ${{ vars.TAURI_UPDATER_ENDPOINT }}
          TAURI_WINDOWS_TIMESTAMP_URL: ${{ vars.TAURI_WINDOWS_TIMESTAMP_URL }}

      - name: Build signed updater artifacts
        shell: bash
        run: >-
          npx tauri build
          --config src-tauri/tauri.release.generated.conf.json
          --bundles "${{ matrix.bundles }}"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          RUST_BACKTRACE: 1

      - name: Check Tauri artifact size budget
        run: npm run check:tauri-artifact-budget -- src-tauri/target/release/bundle "${{ matrix.budget_platform }}"

      - name: Verify packaged Linux server resource
        if: runner.os == 'Linux'
        shell: bash
        run: |
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -type f -print -quit)"
          test -n "$deb"
          extracted="$(mktemp -d)"
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "$deb" "$extracted"
          node scripts/verify-tauri-package.js "$extracted" --run-server

      - name: Smoke-test packaged macOS app startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          bash scripts/smoke-test-tauri-macos-app.sh "$mount_dir"

      - name: Verify packaged macOS server resource
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg="$(find src-tauri/target/release/bundle/dmg -name '*.dmg' -type f -print -quit)"
          test -n "$dmg"
          mount_dir="$(mktemp -d)"
          cleanup() { hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rmdir "$mount_dir" || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount_dir"
          node scripts/verify-tauri-package.js "$mount_dir" --run-server

      - name: Verify packaged Windows server resource
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'No NSIS installer was produced' }
          $extracted = Join-Path $env:RUNNER_TEMP 'clawchat-release-package'
          New-Item -ItemType Directory -Path $extracted -Force | Out-Null
          & 7z.exe x $installer.FullName "-o$extracted" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed with exit code $LASTEXITCODE" }
          node scripts/verify-tauri-package.js $extracted --run-server

      - name: Verify Windows Authenticode signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem 'src-tauri/target/release/bundle/nsis' `
              -Filter '*.exe' `
              -File `
              -Recurse
          )
          if ($installers.Count -eq 0) {
            throw 'No Windows installer was produced'
          }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($installer.Name): $($signature.Status)"
            }
          }

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$app_path" || { echo 'No macOS app bundle was produced' >&2; exit 1; }
          test -n "$dmg_path" || { echo 'No macOS DMG was produced' >&2; exit 1; }
          # An ad-hoc signature is still a signature, so this holds either way.
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [ "${APPLE_SIGNING_ENABLED:-0}" = '1' ]; then
            # Gatekeeper assessment and a stapled ticket only exist for a
            # Developer ID build that went through notarization.
            spctl --assess --type execute --verbose=2 "$app_path"
            xcrun stapler validate "$dmg_path"
          else
            echo 'Ad-hoc signed build: skipping Gatekeeper assessment and notarization checks.'
          fi

      - name: Verify embedded Linux AppImage signature
        if: runner.os == 'Linux' && env.LINUX_SIGNING_ENABLED == '1'
        shell: bash
        run: |
          set -euo pipefail
          appimage_path="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$appimage_path" || { echo 'No AppImage was produced' >&2; exit 1; }
          chmod +x "$appimage_path"
          "$appimage_path" --appimage-signature | tee "$RUNNER_TEMP/appimage-signature.txt"
          grep -q -- '-----BEGIN PGP SIGNATURE-----' "$RUNNER_TEMP/appimage-signature.txt"

      - name: Stage verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.release_artifact }}
          path: ${{ matrix.release_paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Remove temporary Apple keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -n "${CLAWCHAT_SIGNING_KEYCHAIN:-}" ]]; then
            security default-keychain -s login.keychain-db || true
            security delete-keychain "$CLAWCHAT_SIGNING_KEYCHAIN" || true
          fi

      - name: Remove imported Windows certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT)) {
            Remove-Item `
              -Path "Cert:\CurrentUser\My\$env:TAURI_WINDOWS_CERTIFICATE_THUMBPRINT" `
              -Force `
              -ErrorAction SilentlyContinue
          }

  publish:
    name: Assemble verified desktop release
    needs: [preflight, release]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:actions-pinned

      - name: Download verified platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ClawChat-release-*
          path: release-input

      - name: Build combined updater manifest and checksums
        run: npm run generate:tauri-release -- release-input release-artifacts
        env:
          GITHUB_REF_NAME: ${{ needs.preflight.outputs.tag }}

      - name: Verify final release inventory
        shell: bash
        run: |
          test -s release-artifacts/latest.json
          test -s release-artifacts/checksums.txt
          test "$(find release-artifacts -maxdepth 1 -name '*.sig' -type f | wc -l)" -eq 3
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 12
          node -e "const p=require('./release-artifacts/latest.json').platforms; for (const k of ['linux-x86_64','darwin-aarch64','windows-x86_64']) if (!p[k]) throw new Error('missing '+k)"
          (cd release-artifacts && sha256sum --check checksums.txt)

      - name: Create one complete draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          name: ClawChat v${{ needs.preflight.outputs.version }}
          body: See the verified assets below to install or update ClawChat.
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-artifacts/*
