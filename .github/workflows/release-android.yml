name: Release Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Android release
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check:actions-pinned
      - run: npm run check:release-version
      - run: node scripts/generate-api-contracts.js --check

      # The in-app updater installs a released APK over an existing one, which
      # the system only accepts when both were signed with the same key. A
      # missing or partial keystore therefore has to fail before anything is
      # built, not produce an APK nobody can install.
      - name: Validate release signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'ANDROID_KEYSTORE_BASE64 is required' >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'ANDROID_KEYSTORE_PASSWORD is required' >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'ANDROID_KEY_ALIAS is required' >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'ANDROID_KEY_PASSWORD is required' >&2; exit 1; }

      - name: Require the current origin/main commit and a new release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)" || {
            echo 'Android releases must run from the current origin/main commit.' >&2
            exit 1
          }
          version="$(node -p "require('./package.json').version")"
          tag="android-v$version"
          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null; then
            echo "Release tag already exists: $tag" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Import the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/clawchat-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$keystore" >> "$GITHUB_ENV"

      - name: Test, lint, and build the signed release artifacts
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug lintRelease assembleRelease bundleRelease --warning-mode all

      - name: Verify the APK signature and version
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          # An unsigned or debug-signed APK cannot update an installed release,
          # and the certificate digest is what an operator compares against the
          # previous release before publishing.
          "$build_tools/apksigner" verify --print-certs "$apk"
          "$build_tools/aapt2" dump badging "$apk" | grep -F "versionName='$VERSION'"

      - name: Stage the release assets
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "release-artifacts/ClawChat-$VERSION.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "release-artifacts/ClawChat-$VERSION.aab"
          # The in-app updater downloads this digest next to the APK and
          # refuses an installer whose bytes do not match it.
          (cd release-artifacts && sha256sum "ClawChat-$VERSION.apk" > "ClawChat-$VERSION.apk.sha256")
          (cd release-artifacts && sha256sum --check "ClawChat-$VERSION.apk.sha256")
          test "$(find release-artifacts -maxdepth 1 -type f | wc -l)" -eq 3

      - name: Create one complete draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ClawChat Android v${{ steps.release.outputs.version }}
          body: |
            Android release ${{ steps.release.outputs.version }}.

            Installed copies of ClawChat find this release through the in-app
            updater once it is published. To install by hand, download
            `ClawChat-${{ steps.release.outputs.version }}.apk`.
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release-artifacts/*

      - name: Remove the imported keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/clawchat-release.jks"
