version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
